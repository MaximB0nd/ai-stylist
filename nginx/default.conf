upstream frontend_app {
    server frontend:5091;
}

upstream backend_api {
    server backend_core:8000;
}

# Rate limiting zone for external AI Core webhooks (protects against flood and brute-force)
limit_req_zone $binary_remote_addr zone=ai_webhook_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Standard security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Dedicated protected route for AI Core Webhooks
    location /api/v1/internal/ {
        # Only allow POST (webhooks are strictly POST)
        limit_except POST {
            deny all;
        }

        # Rate limiting to mitigate denial-of-service / brute-force
        limit_req zone=ai_webhook_limit burst=20 nodelay;

        # Webhook payload size limit (metadata and photo lists only)
        client_max_body_size 5m;

        # Optional: Uncomment and restrict to AI Core IP/subnet if known:
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
