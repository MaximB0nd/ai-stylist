services:
  s3:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${ARTIFACT_S3_ACCESS_KEY:?set ARTIFACT_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${ARTIFACT_S3_SECRET_KEY:?set ARTIFACT_S3_SECRET_KEY}
      S3_BUCKET: artifacts
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - artifact_s3_data:/data
    networks:
      - artifact_local

  artifact_service:
    build:
      context: ../../..
      dockerfile: src/internal/artifact_service/Dockerfile
    environment:
      ARTIFACT_S3_ENDPOINT: http://s3:8333
      ARTIFACT_S3_ACCESS_KEY: ${ARTIFACT_S3_ACCESS_KEY:?set ARTIFACT_S3_ACCESS_KEY}
      ARTIFACT_S3_SECRET_KEY: ${ARTIFACT_S3_SECRET_KEY:?set ARTIFACT_S3_SECRET_KEY}
      ARTIFACT_SOURCE_ORIGIN: ${ARTIFACT_SOURCE_ORIGIN:?set ARTIFACT_SOURCE_ORIGIN}
      ARTIFACT_PUBLIC_BASE_URL: ${ARTIFACT_PUBLIC_BASE_URL:-http://127.0.0.1:18081}
    ports:
      - "127.0.0.1:18081:8000"
    depends_on:
      - s3
    restart: on-failure
    networks:
      - artifact_local

volumes:
  artifact_s3_data:

networks:
  artifact_local:
    driver: bridge
