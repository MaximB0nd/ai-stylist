[project]
name = "ai-stylist-artifact-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "pydantic-settings>=2.4,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "moto[s3]>=5,<6",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
