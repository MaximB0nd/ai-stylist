services:
  backend_core:
    environment:
      AI_CORE_URL: http://ai-core-api:8000
    depends_on:
      ai-core-api:
        condition: service_healthy

  ai-core-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_core
      POSTGRES_PASSWORD: ${AI_CORE_POSTGRES_PASSWORD:?AI_CORE_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ai_core
    volumes:
      - ai_core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_core -d ai_core"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stylist-net

  ai-core-artifact-service:
    image: ${AI_CORE_ARTIFACT_IMAGE:-ai-stylist-core-artifact-service:local}
    restart: unless-stopped
    environment:
      ARTIFACT_S3_ENDPOINT: http://minio:9000
      ARTIFACT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      ARTIFACT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      ARTIFACT_BUCKET: ai-core-artifacts
      ARTIFACT_SOURCE_ORIGIN: http://minio:9000
      ARTIFACT_PUBLIC_BASE_URL: ${AI_CORE_ARTIFACT_PUBLIC_BASE_URL:?AI_CORE_ARTIFACT_PUBLIC_BASE_URL is required}
    ports:
      - "${AI_CORE_ARTIFACT_BIND_ADDRESS:-0.0.0.0}:18081:8000"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - stylist-net

  ai-core-orchestrator:
    image: ${AI_CORE_ORCHESTRATOR_IMAGE:-ai-stylist-core-orchestrator:local}
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
    environment:
      ORCHESTRATOR_DATABASE_URL: postgresql+asyncpg://ai_core:${AI_CORE_POSTGRES_PASSWORD}@ai-core-postgres:5432/ai_core
      ORCHESTRATOR_ENCRYPTION_KEY: ${AI_CORE_ORCHESTRATOR_ENCRYPTION_KEY:?AI_CORE_ORCHESTRATOR_ENCRYPTION_KEY is required}
      ORCHESTRATOR_ARTIFACT_SERVICE_URL: http://ai-core-artifact-service:8000
      ORCHESTRATOR_WORKER_URLS: ${AI_CORE_WORKER_URLS:?AI_CORE_WORKER_URLS must map every required pipeline stage}
      ORCHESTRATOR_WORKER_TIMEOUT_SECONDS: 1800
      ORCHESTRATOR_MIN_INPUT_URL_TTL_SECONDS: 900
    ports:
      - "127.0.0.1:${AI_CORE_ORCHESTRATOR_PORT:-18180}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ai-core-postgres:
        condition: service_healthy
      ai-core-artifact-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - stylist-net

  ai-core-api:
    image: ${AI_CORE_API_IMAGE:-ai-stylist-core-public-api:local}
    restart: unless-stopped
    environment:
      AI_CORE_API_ORCHESTRATOR_URL: http://ai-core-orchestrator:8000
      AI_CORE_API_INPUT_ORIGINS: '["http://minio:9000"]'
      AI_CORE_API_MIN_INPUT_URL_TTL_SECONDS: 900
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      ai-core-orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - stylist-net

volumes:
  ai_core_postgres_data:
