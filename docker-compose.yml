services:
  db:
    image: postgres:16-alpine
    container_name: stylist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stylist}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-stylist}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - stylist-net

  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    image: stylist-minio:latest
    container_name: stylist-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - stylist-net

  backend_core:
    build:
      context: ./src/backend_core
      dockerfile: Dockerfile
    container_name: stylist-backend-core
    restart: unless-stopped
    command: sh -c "python -m app.db.baseline && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required. Please set it in .env}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stylist}
      PROJECT_NAME: ${PROJECT_NAME:-AI Stylist Backend Core}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stylist}
      MINIO_SECURE: "false"
      AI_CORE_URL: ${AI_CORE_URL:-http://ai-core:8001}

      AI_CORE_SERVICE_TOKEN: ${AI_CORE_SERVICE_TOKEN:-temporary-ai-core-service-token}
      AI_CORE_WEBHOOK_SECRET: ${AI_CORE_WEBHOOK_SECRET:-temporary-ai-core-webhook-secret}
    volumes:
      - ./src/backend_core/app:/app/app
      - ./src/backend_core/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - stylist-net

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: stylist-frontend
    restart: unless-stopped
    environment:
      APP_ENV: ${FRONTEND_APP_ENV:-development}
      PORT: 5091
    expose:
      - "5091"
    depends_on:
      - backend_core
    networks:
      - stylist-net

  nginx:
    image: nginx:1.27-alpine
    container_name: stylist-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend_core
    networks:
      - stylist-net

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  stylist-net:
    driver: bridge
