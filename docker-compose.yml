services:
  db:
    image: postgres:16-alpine
    container_name: stylist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stylist}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/backend_core/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-stylist}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - stylist-net

  backend_core:
    build:
      context: ./src/backend_core
      dockerfile: Dockerfile
    container_name: stylist-backend-core
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-temporary-secret-key-for-dev-change-in-prod}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-stylist}
      PROJECT_NAME: ${PROJECT_NAME:-AI Stylist Backend Core}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      - ./src/backend_core/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stylist-net

volumes:
  postgres_data:
    driver: local

networks:
  stylist-net:
    driver: bridge
