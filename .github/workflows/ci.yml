# CI for backend core tests and docker compose deployment
name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/backend_core/**'
      - 'docker-compose*'
      - 'Dockerfile*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job for testing backend core
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/backend_core/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend_core/requirements.txt
          pip install allure-pytest==2.13.5

      - name: Run tests with Allure
        id: run_tests
        working-directory: src/backend_core
        run: |
          pytest tests -v --alluredir=allure-results

      - name: Install Allure CLI and generate allure report
        if: ${{ always() && steps.run_tests.outcome != 'skipped' }}
        run: |
          npm install -g allure-commandline@2.32.0 --save-dev
          npx allure generate src/backend_core/allure-results --clean -o allure-report

      - name: Upload Allure Report Artifact
        if: ${{ always() && steps.run_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: allure-report
          path: allure-report
          retention-days: 3

  # Test docker compose deployment
  docker-check:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Compose Config
        run: docker compose config

      - name: Build Docker Containers
        run: docker compose build