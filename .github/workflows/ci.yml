# CI for backend core tests and docker compose deployment
name: Backend CI

on: 
  pull_request: 
    branches: [main]
  workflow_dispatch:

# run only on pull requests on branch BACK-№, AI-№
if: >
  github.event_name == 'workflow_dispatch' ||
  startsWith(github.head_ref, 'BACK-') ||
  startsWith(github.head_ref, 'AI-')

jobs:
  # Job for testing backend core
  test: 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: src/backend_core/requirements.txt # Путь к файлу зависимостей для кэша
      
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r src/backend_core/requirements.txt
          pip install allure-pytest

      - name: Run tests with Allure
        working-directory: src/backend_core # Задает рабочую директорию для всего шага
        run: |
          pytest tests -v --alluredir=allure-results
      
      - name: Install Allure CLI and generate allure report
        if: steps.run_tests.outcome != 'skipped'
        run: |
          npm install -g allure-commandline --save-dev
          npx allure generate src/backend_core/allure-results --clean -o allure-report
      
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 3
  
  # Test docker compose deployment
  docker-check:
    runs-on: ubuntu-latest
    needs: test # Исправлено: имя джобы test, а не tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose Config
        run: docker compose config

      - name: Build Docker Containers
        run: docker compose build